[phases.setup]
# Reconstruido a partir de las rondas anteriores (fuentes para Testimonios,
# 17/09) + la lista nueva que pide Puppeteer para poder correr un Chromium
# de verdad en Railway (18/09, ronda 6 — reseñas reales de Temu). Si tu
# nixpacks.toml real tenía algo más que esto (otro aptPkg, otro comando),
# avisame antes de reemplazarlo para no perderlo.
aptPkgs = [
  "fontconfig", "fonts-dejavu-core", "fonts-liberation",
  "libappindicator3-1", "libasound2", "libatk-bridge2.0-0", "libatk1.0-0",
  "libgbm1", "libgtk-3-0", "libnspr4", "libnss3", "libx11-xcb1",
  "libxcomposite1", "libxcursor1", "libxdamage1", "libxfixes3", "libxi6",
  "libxrandr2", "libxss1", "libxtst6", "xdg-utils"
]
cmds = ["fc-cache -f -v"]

[variables]
FONTCONFIG_PATH = "/etc/fonts"
